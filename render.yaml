services:
  - type: web
    name: simha-pdf-parser-api
    env: docker
    region: singapore
    plan: starter  # $7/mo, always-on (no spin-down) — right-sized for launch traffic
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: pdfparser-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/pdfparser.db
      - key: RAZORPAY_KEY_ID
        sync: false        # set manually in Render dashboard (secret)
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
